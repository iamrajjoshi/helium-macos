name: Build isolated Helium Arc Preview (free ARM64)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact reviewed 40-character commit in iamrajjoshi/helium; never a branch or tag'
        required: true
        type: string
      recover_phase_one:
        description: 'Recover only the reviewed phase-1 checkpoint from run 40051201468'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: helium-arc-preview-free-arm64
  cancel-in-progress: false

jobs:
  build_01:
    uses: ./.github/workflows/mac-preview-phase.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      phase: 1
      recover_phase_one: ${{ inputs.recover_phase_one }}
      restore_key: ${{ inputs.recover_phase_one && 'helium-preview-40051201468-1-1' || '' }}

  build_02:
    needs: build_01
    if: ${{ needs.build_01.outputs.status == 'running' }}
    uses: ./.github/workflows/mac-preview-phase.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      phase: 2
      restore_key: ${{ needs.build_01.outputs.checkpoint }}

  build_03:
    needs: build_02
    if: ${{ needs.build_02.outputs.status == 'running' }}
    uses: ./.github/workflows/mac-preview-phase.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      phase: 3
      restore_key: ${{ needs.build_02.outputs.checkpoint }}

  build_04:
    needs: build_03
    if: ${{ needs.build_03.outputs.status == 'running' }}
    uses: ./.github/workflows/mac-preview-phase.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      phase: 4
      restore_key: ${{ needs.build_03.outputs.checkpoint }}

  build_05:
    needs: build_04
    if: ${{ needs.build_04.outputs.status == 'running' }}
    uses: ./.github/workflows/mac-preview-phase.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      phase: 5
      restore_key: ${{ needs.build_04.outputs.checkpoint }}

  build_06:
    needs: build_05
    if: ${{ needs.build_05.outputs.status == 'running' }}
    uses: ./.github/workflows/mac-preview-phase.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      phase: 6
      restore_key: ${{ needs.build_05.outputs.checkpoint }}

  build_07:
    needs: build_06
    if: ${{ needs.build_06.outputs.status == 'running' }}
    uses: ./.github/workflows/mac-preview-phase.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      phase: 7
      restore_key: ${{ needs.build_06.outputs.checkpoint }}

  build_08:
    needs: build_07
    if: ${{ needs.build_07.outputs.status == 'running' }}
    uses: ./.github/workflows/mac-preview-phase.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      phase: 8
      restore_key: ${{ needs.build_07.outputs.checkpoint }}

  build_09:
    needs: build_08
    if: ${{ needs.build_08.outputs.status == 'running' }}
    uses: ./.github/workflows/mac-preview-phase.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      phase: 9
      restore_key: ${{ needs.build_08.outputs.checkpoint }}

  build_10:
    needs: build_09
    if: ${{ needs.build_09.outputs.status == 'running' }}
    uses: ./.github/workflows/mac-preview-phase.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      phase: 10
      restore_key: ${{ needs.build_09.outputs.checkpoint }}

  validate_and_package:
    name: Package isolated draft and execute real GUI app smoke
    needs: [build_01, build_02, build_03, build_04, build_05, build_06, build_07, build_08, build_09, build_10]
    if: ${{ always() && !cancelled() && github.repository == 'iamrajjoshi/helium-macos' && github.event.repository.private == false }}
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: write # Only a draft release on this packaging fork, never publish.
      actions: write # Delete only this run's cache after a verified draft upload.
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      COMPLETE_KEY: ${{ needs.build_01.outputs.complete_checkpoint || needs.build_02.outputs.complete_checkpoint || needs.build_03.outputs.complete_checkpoint || needs.build_04.outputs.complete_checkpoint || needs.build_05.outputs.complete_checkpoint || needs.build_06.outputs.complete_checkpoint || needs.build_07.outputs.complete_checkpoint || needs.build_08.outputs.complete_checkpoint || needs.build_09.outputs.complete_checkpoint || needs.build_10.outputs.complete_checkpoint }}
    steps:
      - name: Fail if all compile phases exhausted or failed
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -z "$COMPLETE_KEY" ]]; then
            echo '::error::No fully built browser checkpoint. No DMG or successful build is claimed.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: iamrajjoshi/helium
          ref: ${{ inputs.source_sha }}
          path: helium-chromium
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare standard runner
        shell: bash
        run: bash .github/scripts/mac_preview.sh setup
      - id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: preview-checkpoint
          key: ${{ env.COMPLETE_KEY }}
          fail-on-cache-miss: true
      - name: Verify source, configuration and toolchain before using binaries
        shell: bash
        run: |
          if [[ "$CACHE_HIT" != true ]]; then
            echo '::error::Refusing a partial-prefix or missing checkpoint cache match.'
            exit 1
          fi
          bash .github/scripts/mac_preview.sh restore
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          RESTORE_KEY: ${{ env.COMPLETE_KEY }}
      - name: Make DMG, verify ad-hoc signature, mount read-only and launch packaged app
        shell: bash
        run: bash .github/scripts/mac_preview.sh package
      - name: Store verified candidate in an unpublished draft release
        id: draft
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./.github/scripts/mac_preview_draft.js')({github, context, core});
      - name: Delete only this completed run's consumed cache
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./.github/scripts/mac_preview_cache.js')({github, context, core}, 'cleanup');
      - name: Always report final status and retain console logs
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f .github/scripts/mac_preview.sh ]]; then
            bash .github/scripts/mac_preview.sh summary
          else
            echo 'No completed build checkpoint; validation and packaging were not run.' >> "$GITHUB_STEP_SUMMARY"
          fi
